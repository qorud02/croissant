name: Verify archived FileSet parsing
on:
  push:
    branches: [codex/verify-archive-filesets-20261112]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/python/mlcroissant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install './python/mlcroissant[git,image,parquet,beam,audio,dicom]' pytest 'black==23.11.0' isort
      - name: Prove original archive failures
        run: |
          cp python/mlcroissant/mlcroissant/_src/operation_graph/graph.py "$RUNNER_TEMP/graph_patched.py"
          cp ci/archive_graph_baseline.py python/mlcroissant/mlcroissant/_src/operation_graph/graph.py
          set +e
          python -m pytest python/mlcroissant/mlcroissant/_src/operation_graph/archive_file_set_test.py -q --junitxml=baseline-archive.xml
          result=$?
          set -e
          test "$result" -eq 1
          python -c "import xml.etree.ElementTree as E; s=E.parse('baseline-archive.xml').getroot().find('testsuite'); assert (int(s.get('tests')),int(s.get('failures')),int(s.get('errors'))) == (7,4,0), s.attrib"
          cp "$RUNNER_TEMP/graph_patched.py" python/mlcroissant/mlcroissant/_src/operation_graph/graph.py
      - name: Verify archive regression and existing operation graph tests
        run: python -m pytest python/mlcroissant/mlcroissant/_src/operation_graph -q --junitxml=patched-operations.xml
      - name: Run hermetic dataset integration tests
        run: python -m pytest python/mlcroissant/mlcroissant/_src/datasets_test.py -m 'not nonhermetic' -q
      - name: Check formatting without changing source
        if: always()
        run: |
          python -m black --check --diff --preview --line-length 88 python/mlcroissant/mlcroissant/_src/operation_graph/graph.py python/mlcroissant/mlcroissant/_src/operation_graph/archive_file_set_test.py
          python -m isort --check-only --settings-path python/mlcroissant/pyproject.toml python/mlcroissant/mlcroissant/_src/operation_graph/graph.py python/mlcroissant/mlcroissant/_src/operation_graph/archive_file_set_test.py
