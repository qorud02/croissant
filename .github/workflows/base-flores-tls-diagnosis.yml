name: Reproduce upstream-base FLORES TLS failure
on:
  push:
    branches: [codex/verify-upstream-base-tls-20261112]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/python/mlcroissant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged upstream base
        run: python -m pip install './python/mlcroissant[git,image,parquet,beam,audio,dicom]' pytest
      - name: Reproduce and classify the four original failures
        run: |
          set +e
          python -m pytest python/mlcroissant/mlcroissant/_src/datasets_nonhermetic_test.py -k flores -q --junitxml=base-flores.xml > base-flores.log 2>&1
          result=$?
          set -e
          cat base-flores.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as E
          root=E.parse('base-flores.xml').getroot()
          cases=root.findall('.//testcase')
          assert len(cases)==4, len(cases)
          for case in cases:
              failure=case.find('failure')
              assert failure is not None, case.attrib
              text=failure.text or ''
              assert 'certificate has expired' in text, text[-1500:]
              assert 'dl.fbaipublicfiles.com' in text, text[-1500:]
          print('Unchanged base 093b32f: all four FLORES tests fail on the expired source TLS certificate; neither PR source change is present.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-base-flores-diagnosis
          path: |
            base-flores.xml
            base-flores.log
